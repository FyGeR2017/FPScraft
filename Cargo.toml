[package]
name = "fpscraft"
version = "0.1.1"
edition = "2021"
description = "Gaming & Hardware Overlay in Rust (FPS, CPU/GPU Temp, RAM, Power, Network)"

[dependencies]
eframe = "0.31"
nvml-wrapper = "0.10"
raw-window-handle = "0.6"
sysinfo = "0.33"
tray-icon = "0.26.1"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[build-dependencies]
winresource = "0.1.34"
